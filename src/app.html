<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <title>Orbit</title>
    <script>
      try {
        const mode = localStorage.getItem('maxogram_appearance');
        const dark = mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#000000' : '#ffffff';
      } catch {}
    </script>
    %sveltekit.head%
    <style>
      body {
        margin: 0;
        background-color: var(--bg-app, #ffffff);
        overflow: hidden;
      }

      #app {
        display: contents;
      }

      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: var(--bg-app, #ffffff);
        z-index: 99999;
        user-select: none;
        -webkit-user-select: none;
        transition: opacity 0.25s ease-out, visibility 0.25s ease-out;
      }

      .initial-loader.loaded {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .initial-loader.loaded .loader-dots span {
        animation-play-state: paused;
      }

      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .loader-icon-wrapper {
        width: 76px;
        height: 76px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .loader-icon {
        width: 100%;
        height: 100%;
        border-radius: 20px;
      }

      .loader-title {
        color: var(--text-primary, #17171b);
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.5px;
        font-family: system-ui, sans-serif;
      }

      .loader-dots {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 4px;
      }

      .loader-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent-primary, #0066d6);
        animation: pulse-dot 1.2s infinite ease-in-out;
      }

      .loader-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }

      .loader-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }

      .loader-credits {
        position: absolute;
        bottom: max(24px, env(safe-area-inset-bottom, 24px));
        left: 20px;
        right: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
      }

      .credits-text {
        font-size: 13px;
        color: var(--text-muted, #62626b);
        font-weight: 400;
        letter-spacing: 0.2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 90%;
        font-family: system-ui, sans-serif;
      }

      @keyframes pulse-dot {
        0%, 80%, 100% {
          opacity: 0.2;
          transform: scale(0.8);
        }
        40% {
          opacity: 1;
          transform: scale(1.2);
        }
      }
    </style>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="initial-loader" class="initial-loader">
      <div class="loader-content">
        <div class="loader-icon-wrapper">
          <img class="loader-icon" src="%sveltekit.assets%/favicon.png" alt="" width="76" height="76" />
        </div>
        <div class="loader-title">Orbit</div>
        <div class="loader-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
      <div class="loader-credits">
        <span id="initial-credits-text" class="credits-text"></span>
      </div>
    </div>
    <div id="app">%sveltekit.body%</div>
    <script>
      (async () => {
        try {
          let list = [
            ["contributor", "JuniorAww", "Разработал", 5],
            ["contributor", "hu553in", "Адаптировал", 5],
            ["contributor", "megazoll", "Улучшил", 1]
          ];

          const invoke = window.__TAURI_INTERNALS__?.invoke || window.__TAURI__?.core?.invoke;
          if (invoke) {
            const disk = await invoke("common_store_load", { store: "credits_cache" }).catch(() => null);
            if (Array.isArray(disk) && disk.length) list = disk;
          }

          const getW = x => Math.max(1, +(x?.[3] ?? x?.p) || 1);
          let rnd = Math.random() * list.reduce((sum, item) => sum + getW(item), 0);
          const chosen = list.find(item => (rnd -= getW(item)) < 0) || list.at(-1);

          const name = chosen?.[1] ?? chosen?.name ?? "";
          const text = chosen?.[2] ?? chosen?.text ?? "";
          const str = [text, name].filter(Boolean).join(" ");

          const el = document.getElementById("initial-credits-text");
          if (el && str) el.textContent = str;
        } catch {}
      })();
    </script>
  </body>
</html>
